name: Lean verification

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1.6.0
        with:
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: true
      - name: Strict build and axiom checks
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          ./scripts/check.sh
          git diff --exit-code HEAD -- lean-toolchain lakefile.toml lake-manifest.json
          printf 'Strict build and axiom checks passed for `%s`.\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
